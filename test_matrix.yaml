# Настройки окружения
env:
  user: "adminsen"
  transmitter_ip: "192.168.10.250"
  receiver_ip: "192.168.10.200" # Основной IP для управления

# Матрица тестов
tests:
  - name: "iperf_main_tunnel"
    type: "iperf3"
    src_port: 5003        # Порт на Трансмиттере (MUXLINK)
    dst_port: 5004        # Порт на Ресивере (iperf3 server)
    bytes: "4096M"
    expected_min_gbps: 5.0

  - name: "crc_file_transfer"
    type: "crc"
    src_port: 5003        # Порт на Трансмиттере (MUXLINK)
    dst_port: 5004        # Порт на Ресивере (nc listener)
    file_url: "https://speedtest.selectel.ru/1GB"
    file_path: "/var/tmp/test_1gb.bin"
